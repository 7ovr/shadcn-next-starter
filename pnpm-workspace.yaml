packages: []

allowBuilds:
  # Hooks install through the prepare script instead.
  lefthook: false
  # Next optimises images with it.
  sharp: true

overrides:
  # get-uri asks for 5.x, which has no patched release.
  'basic-ftp@<6.2.1': ^6.2.6
  # The shadcn CLI still uses ts-morph's older minimatch range.
  '@ts-morph/common@0.27.0>minimatch': 11.0.9
